name: Generate OGN CDB

on:
  schedule:
    - cron: '0 3 * * *' # Triggers every day at 03:00 UTC
  workflow_dispatch:      # Allows manual trigger via the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial permission for the action to create/overwrite a Release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run CDB generator script
      run: python ogn_cdb.py

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Upload Artifact (Backup Build)
      uses: actions/upload-artifact@v4
      with:
        name: ogn-cdb-file
        path: ogn.cdb

    - name: Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: OGN Database (${{ steps.date.outputs.date }})
        body: |
          Automatically compiled OGN CDB file for SoftRF / OGN Trackers.
          
          Build Date: ${{ steps.date.outputs.date }}
          Build Commit/Trigger: ${{ github.sha }}
        files: ogn.cdb
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}